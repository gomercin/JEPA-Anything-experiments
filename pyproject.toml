[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "jepa-anything-core/tests",
  "jepa-anything-skill/tests",
  "experiments/coupled_oscillators/tests",
  "experiments/mediated_patterns/tests",
  "evidence/completed-2026-09-25/tests",
  "evidence/organization-response-2026-09-25/tests",
  "evidence/source-receiver-relay-2026-09-25/tests",
  "evidence/history-conditioned-transmission-2026-09-26/tests",
  "evidence/present-state-transmission-2026-09-26/tests",
]
pythonpath = [
  ".",
  "jepa-anything-core/src",
  "jepa-anything-skill",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["jepa_anything_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true
